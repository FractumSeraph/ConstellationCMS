{% extends "base.html" %}
{% block title %}Set up{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Welcome</h1>
  <p>Choose the password that protects this studio. It is stored only on this machine.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <label>Password <input type="password" name="password" minlength="10" required autofocus></label>
    <label>Again <input type="password" name="confirm" minlength="10" required></label>
    <button class="primary">Create studio</button>
  </form>
</section>
{% endblock %}
