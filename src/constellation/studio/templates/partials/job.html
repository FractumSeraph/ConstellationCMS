<div class="job {{ job.status }}" {% if job.status == 'running' %}hx-get="/jobs/{{ job.id }}" hx-trigger="every 1s" hx-swap="outerHTML"{% endif %}>
  <p><strong>{{ job.kind }}</strong> · {{ job.status }}{% if job.error %} · <span class="error">{{ job.error }}</span>{% endif %}</p>
  <pre class="log">{% for line in job.log %}{{ line }}
{% endfor %}</pre>
</div>
