[project]
name = "constellationcms"
version = "0.0.1"
description = "A static site manager for multiple web stacks: write once, publish to the web, Gemini, and more."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "Fractum Seraph" }]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "python-frontmatter>=1.1",
    "python-slugify>=8.0",
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "pydantic>=2.7",
    "pillow>=10.3",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-slugify",
    "types-PyYAML",
    "types-paramiko>=5.1.0.20261030",
]

[project.scripts]
constellation = "constellation.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "constellation"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["constellation"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*", "mdit_py_plugins.*", "markdown_it.*"]
ignore_missing_imports = true
